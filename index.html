<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>당구 레슨 · 로그인</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#11161d">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<style>
  :root { color-scheme: dark; --bg: #0b0e13; --card: #161b23; --line: #2a3340; --text: #e8edf3; --muted: #93a1b2; --gold: #e6c15a; --bad: #ff7070; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 50% 30%, #13324f 0%, var(--bg) 60%); color: var(--text);
    font-family: system-ui, -apple-system, "Noto Sans KR", "Malgun Gothic", sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px 16px 60px; }
  .card { width: min(380px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px 20px; box-shadow: 0 10px 40px rgba(0,0,0,.45); }
  .logo { display: flex; gap: 10px; align-items: center; margin-bottom: 4px; }
  .logo img { width: 44px; height: 44px; border-radius: 10px; }
  h1 { font-size: 21px; margin: 0; }
  .sub { color: var(--gold); font-size: 13px; font-weight: 700; margin: 2px 0 16px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  input[type=text], input[type=password] { width: 100%; font-size: 17px; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: #0f141b; color: var(--text); }
  input:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid #6fb6ff; outline-offset: 2px; }
  .row { display: flex; align-items: center; gap: 8px; margin: 12px 0 4px; font-size: 14px; }
  .row input { width: 20px; height: 20px; }
  button { font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--line); background: #222b37; color: var(--text); padding: 11px 12px; }
  .primary { width: 100%; margin-top: 14px; font-size: 17px; font-weight: 700; background: #2f7fe0; border-color: #2f7fe0; color: #fff; }
  .primary:disabled { opacity: .6; cursor: wait; }
  .find { width: 100%; margin-top: 10px; background: transparent; color: var(--gold); border-color: rgba(230,193,90,.5); }
  .msg { min-height: 1.4em; margin-top: 10px; font-size: 14px; color: var(--bad); }
  .msg.ok { color: #6fe08f; }
  .help { margin-top: 10px; font-size: 13px; color: var(--muted); line-height: 1.5; }
  .help a { color: var(--gold); }
  .pw { position: relative; } .pw button { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); padding: 5px 8px; font-size: 12px; }
  .shopbar { position: fixed; left: 0; right: 0; bottom: 0; text-align: center; padding: 5px 8px; font-size: 13px; font-weight: 700; color: var(--gold);
    background: rgba(10,12,16,.92); border-top: 1px solid rgba(230,193,90,.45); }
  .shopbar a { color: #f3d27a; text-decoration: none; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="card" id="card" hidden>
  <div class="logo"><img src="icon-192.png" alt=""><h1>당구 레슨</h1></div>
  <div class="sub">깐부킹당구장 회원 전용</div>
  <form id="f" autocomplete="on">
    <label for="uid">아이디</label>
    <input type="text" id="uid" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    <label for="pw">비밀번호</label>
    <div class="pw"><input type="password" id="pw" name="password" autocomplete="current-password" required><button type="button" id="eye" aria-label="비밀번호 보기">보기</button></div>
    <div class="row"><input type="checkbox" id="remember" checked><label for="remember" style="margin:0;color:var(--text)">이 기기 기억하기 (90일)</label></div>
    <button class="primary" id="go" type="submit">들어가기</button>
  </form>
  <button class="find" id="find" type="button">비밀번호 찾기 (관리자에게 문자)</button>
  <div class="msg" id="msg" role="alert" aria-live="assertive"></div>
  <div class="help">비밀번호를 모르면 위 버튼을 누르거나 관리자에게 문자·전화: <a href="tel:01025008553">010-2500-8553</a></div>
</main>
<div class="shopbar">깐부킹당구장 수원 매탄점 · 1인 6시간 7000원 · TEL <a href="tel:0312126779">031-212-6779</a> · HP <a href="tel:01025008553">010-2500-8553</a></div>
<script>
(() => {
  const ITER = 600000, PEPPER = 'kkanbu-billiards|', DAYS = 90;
  const $ = (id) => document.getElementById(id), enc = new TextEncoder(), dec = new TextDecoder();
  const un = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const msg = (t, ok) => { $('msg').textContent = t; $('msg').className = 'msg' + (ok ? ' ok' : ''); };
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((r) => r.update()).catch(() => {});
  if (!window.crypto || !crypto.subtle) { document.body.innerHTML = '<p style="padding:20px">이 화면은 https 주소에서만 열립니다.</p>'; return; }

  // 기억한 열쇠: IndexedDB에 '꺼낼 수 없는' 열쇠로 저장 (기간이 지나면 지움)
  const db = () => new Promise((ok, no) => { const r = indexedDB.open('billiards-auth', 1); r.onupgradeneeded = () => r.result.createObjectStore('k'); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
  const idb = async (mode, fn) => { const d = await db(); return new Promise((ok, no) => { const t = d.transaction('k', mode), s = t.objectStore('k'), r = fn(s); t.oncomplete = () => ok(r && r.result); t.onerror = () => no(t.error); }); };
  const saveKey = (v) => idb('readwrite', (s) => s.put(v, 'me')).catch(() => {});
  const loadKey = () => idb('readonly', (s) => s.get('me')).catch(() => null);
  const dropKey = () => idb('readwrite', (s) => s.delete('me')).catch(() => {});

  async function unwrap(uid, pw) {
    const keys = await (await fetch('keys.json', { cache: 'no-cache' })).json();
    const h = btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.digest('SHA-256', enc.encode(PEPPER + uid.toLowerCase())))));
    const u = keys.users.find((x) => x.h === h); if (!u) return null;
    const base = await crypto.subtle.importKey('raw', enc.encode(uid.toLowerCase() + '\n' + pw), 'PBKDF2', false, ['deriveKey']);
    const kek = await crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: un(u.salt), iterations: keys.iter || ITER }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    try {
      const raw = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: un(u.wiv) }, kek, un(u.wct));
      return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);   // 꺼낼 수 없는 열쇠
    } catch (e) { return null; }
  }
  async function open(key, uid) {
    const b = await (await fetch('app.enc', { cache: 'no-cache' })).json();
    const plain = async (x) => dec.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: un(x.iv) }, key, un(x.ct)));
    const html = await plain(b.app), stance = await plain(b.stance);
    window.__STANCE_URL = URL.createObjectURL(new Blob([stance], { type: 'text/javascript' }));
    window.__userId = (uid || '').toLowerCase(); window.__built = b.built || '';
    window.__logout = async () => { await dropKey(); location.reload(); };
    document.open(); document.write(html); document.close();
  }

  let fails = 0, waitUntil = 0;
  $('eye').onclick = () => { const p = $('pw'); p.type = p.type === 'password' ? 'text' : 'password'; $('eye').textContent = p.type === 'password' ? '보기' : '숨기기'; };
  $('f').onsubmit = async (e) => {
    e.preventDefault();
    const uid = $('uid').value.trim(), pw = $('pw').value;
    if (!uid || !pw) { msg('아이디와 비밀번호를 넣어 주세요'); return; }
    if (Date.now() < waitUntil) { msg(`여러 번 틀려서 ${Math.ceil((waitUntil - Date.now()) / 1000)}초 뒤에 다시 해 주세요`); return; }
    $('go').disabled = true; msg('확인 중…', true);
    try {
      const key = await unwrap(uid, pw);
      if (!key) {
        fails++; if (fails >= 5) { waitUntil = Date.now() + 30000; fails = 0; }
        msg('아이디 또는 비밀번호가 다릅니다'); $('go').disabled = false; return;
      }
      if ($('remember').checked) await saveKey({ key, uid, exp: Date.now() + DAYS * 864e5 }); else await dropKey();
      msg('열고 있습니다…', true);
      await open(key, uid);
    } catch (err) { msg('열지 못했습니다: ' + (err.message || err) + ' · 인터넷을 켜고 한 번 다시 해 보세요'); $('go').disabled = false; }
  };
  $('find').onclick = () => {
    const uid = $('uid').value.trim();
    const body = `[당구 레슨 앱] 비밀번호 문의\n아이디: ${uid || '(아이디)'}\n이름: `;
    location.href = 'sms:01025008553?body=' + encodeURIComponent(body);
    msg('문자 앱이 안 열리면 010-2500-8553으로 직접 문자나 전화를 해 주세요', true);
  };

  // 기억한 기기면 바로 열기
  (async () => {
    const m = await loadKey();
    if (m && m.key && m.exp > Date.now()) { try { await open(m.key, m.uid); return; } catch (e) { await dropKey(); } }
    else if (m) await dropKey();
    $('card').hidden = false; $('uid').focus();
  })();
})();
</script>
</body>
</html>
